basePath: /
definitions:
  account.ApiResponse:
    properties:
      message:
        type: string
      status:
        type: string
      statusCode:
        type: integer
    type: object
  account.ApiResponseWithData:
    properties:
      status:
        type: string
      statusCode:
        type: integer
    type: object
  account.InfoResponse:
    properties:
      accountNumber:
        type: string
      amount:
        type: string
      color:
        type: string
      currency:
        type: string
      flags:
        items:
          type: string
        type: array
      isMainAccount:
        type: boolean
      issuer:
        type: string
      progress:
        type: integer
      type:
        type: string
    type: object
  auth.ApiResponse:
    properties:
      message:
        type: string
      status:
        type: string
      statusCode:
        type: integer
    type: object
  auth.ApiResponseWithData:
    properties:
      status:
        type: string
      statusCode:
        type: integer
    type: object
  auth.ErrResponse:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  auth.SignInWithPasscodeRequest:
    properties:
      id:
        example: 000027b0e9a211ef95a30242ac180002
        maxLength: 50
        type: string
      passcode:
        example: "123456"
        type: string
    required:
    - id
    - passcode
    type: object
  auth.SignInWithPasswordRequest:
    properties:
      id:
        example: 000027b0e9a211ef95a30242ac180002
        maxLength: 50
        type: string
      password:
        example: 123456Az@
        type: string
    required:
    - id
    - password
    type: object
  auth.TokenResponse:
    properties:
      accessToken:
        type: string
    type: object
  banner.ApiResponse:
    properties:
      message:
        type: string
      status:
        type: string
      statusCode:
        type: integer
    type: object
  banner.ApiResponseWithData:
    properties:
      status:
        type: string
      statusCode:
        type: integer
    type: object
  banner.Response:
    properties:
      description:
        type: string
      image:
        type: string
      title:
        type: string
    type: object
  card.ApiResponse:
    properties:
      message:
        type: string
      status:
        type: string
      statusCode:
        type: integer
    type: object
  card.ApiResponseWithData:
    properties:
      status:
        type: string
      statusCode:
        type: integer
    type: object
  card.DebitCardResponse:
    properties:
      borderColor:
        type: string
      color:
        type: string
      issuer:
        type: string
      name:
        type: string
      number:
        type: string
      status:
        type: string
    type: object
  transaction.ApiResponse:
    properties:
      message:
        type: string
      status:
        type: string
      statusCode:
        type: integer
    type: object
  transaction.ApiResponseWithData:
    properties:
      status:
        type: string
      statusCode:
        type: integer
    type: object
  transaction.RecentTransactionResponse:
    properties:
      image:
        type: string
      isBank:
        type: boolean
      name:
        type: string
    type: object
  user.ApiResponse:
    properties:
      message:
        type: string
      status:
        type: string
      statusCode:
        type: integer
    type: object
  user.ApiResponseWithData:
    properties:
      status:
        type: string
      statusCode:
        type: integer
    type: object
  user.InfoResponse:
    properties:
      greetingMessage:
        type: string
      name:
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: engineering@linebk.com
    name: Engineering Team at KASIKORN LINE Co., Ltd.
    url: https://linebk.com/engineering
  description: Banking Service handling secure authentication, authorization and core
    banking operations.
  license:
    name: Copyright © KASIKORN LINE All Rights reserved
    url: https://linebk.com/licenses
  termsOfService: https://linebk.com/terms/
  title: Banking Service - LINE BK API
  version: 1.0.0
paths:
  /v1/accounts:
    get:
      consumes:
      - application/json
      description: Get a list of accounts by user id
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/account.ApiResponseWithData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/account.InfoResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/account.ApiResponse'
      security:
      - Bearer: []
      summary: Get accounts by user id
      tags:
      - Accounts
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Generate a new access token using a valid refresh token (from HTTP-only
        cookie)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/auth.ErrResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ApiResponse'
      summary: Refresh user token pair
      tags:
      - Auth
  /v1/auth/signin/passcode:
    post:
      consumes:
      - application/json
      description: Signin using id and passcode
      parameters:
      - description: Signin with passscode payload
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/auth.SignInWithPasscodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/auth.ErrResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ApiResponse'
      summary: Signin with id and passcode
      tags:
      - Auth
  /v1/auth/signin/password:
    post:
      consumes:
      - application/json
      description: Signin using id and password
      parameters:
      - description: Signin with password payload
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/auth.SignInWithPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/auth.ErrResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ApiResponse'
      summary: Signin with id and password
      tags:
      - Auth
  /v1/auth/signout:
    post:
      consumes:
      - application/json
      description: Invalidate user session and clear authentication cookies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ApiResponse'
      summary: Sign out user
      tags:
      - Auth
  /v1/banners:
    get:
      consumes:
      - application/json
      description: Get a list of banners by user id
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/banner.ApiResponseWithData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/banner.Response'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/banner.ApiResponse'
      security:
      - Bearer: []
      summary: Get banners by user id
      tags:
      - Banners
  /v1/debit-cards:
    get:
      consumes:
      - application/json
      description: Get a list of debit cards by user id
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/card.ApiResponseWithData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/card.DebitCardResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/card.ApiResponse'
      security:
      - Bearer: []
      summary: Get debit cards by user id
      tags:
      - Debit Cards
  /v1/transactions/recent:
    get:
      consumes:
      - application/json
      description: Get a list of recent transactions by user id
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/transaction.ApiResponseWithData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/transaction.RecentTransactionResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/transaction.ApiResponse'
      security:
      - Bearer: []
      summary: Get recent transactions by user id
      tags:
      - Transactions
  /v1/user:
    get:
      consumes:
      - application/json
      description: Get a user info by id
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/user.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/user.InfoResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ApiResponse'
      security:
      - Bearer: []
      summary: Get user info by id
      tags:
      - Users
securityDefinitions:
  Bearer:
    description: Put **_ONLY_** your JWT Bearer token in textbox below
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
